<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="80" fill="url(#fg)"/>
  <line x1="200" y1="28" x2="1000" y2="28" stroke="#c4a574" stroke-opacity="0.25" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="7s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="52" text-anchor="middle" fill="#8b97a8" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">
    Simplicity is the ultimate sophistication.
  </text>
</svg>
