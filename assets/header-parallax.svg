<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Shahid Hamid">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222">
        <animate attributeName="stop-color" values="#0c1222;#101828;#0c1222" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#152238">
        <animate attributeName="stop-color" values="#152238;#1a2d4a;#152238" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a1628">
        <animate attributeName="stop-color" values="#0a1628;#0f1c30;#0a1628" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c4a574" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
      <animate attributeName="x1" values="-40%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;140%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>

  <!-- Parallax layer 1 (far) -->
  <g opacity="0.35" filter="url(#soft)">
    <ellipse cx="220" cy="160" rx="180" ry="70" fill="#1e3a5f">
      <animate attributeName="cx" values="200;240;200" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;170;150" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="100" rx="160" ry="60" fill="#243b55">
      <animate attributeName="cx" values="960;1000;960" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;110;90" dur="16s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Parallax layer 2 (mid) -->
  <g opacity="0.45">
    <path d="M0,220 C180,190 320,240 480,210 C640,180 780,230 960,200 C1080,185 1160,210 1200,200 L1200,280 L0,280 Z" fill="#132033">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0,220 C180,190 320,240 480,210 C640,180 780,230 960,200 C1080,185 1160,210 1200,200 L1200,280 L0,280 Z;
                M0,225 C190,200 330,235 490,215 C650,190 790,225 970,205 C1090,190 1165,215 1200,205 L1200,280 L0,280 Z;
                M0,220 C180,190 320,240 480,210 C640,180 780,230 960,200 C1080,185 1160,210 1200,200 L1200,280 L0,280 Z"/>
    </path>
  </g>

  <!-- Parallax layer 3 (near accent line) -->
  <rect x="0" y="0" width="1200" height="280" fill="url(#sheen)" opacity="0.4"/>
  <line x1="80" y1="198" x2="1120" y2="198" stroke="#c4a574" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="6s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="118" text-anchor="middle" fill="#f3efe8" font-family="Georgia, 'Times New Roman', serif" font-size="48" letter-spacing="2">
    Shahid Hamid
  </text>
  <text x="600" y="158" text-anchor="middle" fill="#9aa7b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" letter-spacing="4">
    FULL STACK DEVELOPER  ·  DATA ENGINEERING
  </text>
  <text x="600" y="188" text-anchor="middle" fill="#c4a574" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" letter-spacing="1.5" opacity="0.9">
    Systems · Clarity · Longevity
  </text>
</svg>
