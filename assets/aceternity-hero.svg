<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shahid Hamid">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="20%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45">
        <animate attributeName="stop-opacity" values="0.25;0.55;0.25" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.2;0.5;0.2" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="50%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.1;0.3;0.1" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#base)"/>
  <rect width="1200" height="320" fill="url(#auroraA)" filter="url(#blur)"/>
  <rect width="1200" height="320" fill="url(#auroraB)" filter="url(#blur)"/>
  <rect width="1200" height="320" fill="url(#auroraC)" filter="url(#blur)"/>

  <!-- Background beams (Aceternity-style) -->
  <g opacity="0.35">
    <path d="M560,-40 L600,320 L640,-40 Z" fill="url(#beam)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M700,-40 L730,320 L760,-40 Z" fill="url(#beam)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M430,-40 L455,320 L480,-40 Z" fill="url(#beam)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0; 10 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sparkles -->
  <g fill="#e0f2fe">
    <circle cx="180" cy="70" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="90" r="1.8">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="50" r="1.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="120" r="1.4">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="160" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="145" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="600" letter-spacing="-0.5">
    Shahid Hamid
  </text>
  <text x="600" y="185" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="3">
    FULL STACK DEVELOPER  ·  DATA ENGINEERING
  </text>
  <text x="600" y="220" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" opacity="0.9">
    Building elegant systems at the intersection of product and data
  </text>
</svg>
